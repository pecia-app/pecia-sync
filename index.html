<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Pecia Sync</title></head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="Pecia Sync"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 32 32" aria-hidden="true" style="flex-shrink:0;margin-right:3px"><rect width="32" height="32" rx="7" fill="#26473A"/><path fill="#DCE8D6" fill-rule="evenodd" d="M9 26 V15 A9 9 0 0 1 18 6 H23 V17 A9 9 0 0 1 14 26 Z M12 12 H20 V14 H12 Z M12 16 H20 V18 H12 Z M12 20 H17 V22 H12 Z"/></svg> pecia <span>sync</span></a>
    <nav><a href="#overview" data-i18n="overview"></a><a href="#books" data-i18n="booksNav"></a><a href="#annotations" data-i18n="annotationsNav"></a></nav>
    <p class="eyebrow" data-i18n="yourReader"></p><div class="reader-chip"><span class="connection-dot"></span><span id="reader-name" data-i18n="notConnected"></span></div>
    <div class="sidebar-bottom"><p data-i18n="localOnly"></p><a href="mailto:hola@pecia.app" id="support-email" data-i18n="support"></a><div class="languages"><button data-language="es">ES</button><button data-language="en">EN</button></div><small id="app-version"></small></div>
  </aside>
  <main id="overview">
    <header><div><p class="eyebrow">PECIA SYNC · BETA</p><h1 data-i18n="title"></h1><p class="muted" data-i18n="lede"></p></div><div class="actions"><button class="primary" id="device-check" data-i18n="find"></button><button id="kindle-export" disabled data-i18n="save"></button></div></header>
    <p id="device-status" class="status" role="status" aria-live="polite"></p>
    <section class="device-panel" aria-labelledby="device-title">
      <div class="reader-art" aria-hidden="true"><div><span>pecia</span><i></i><i></i><i></i><i></i><small>YOUR NEXT CHAPTER</small></div></div>
      <div class="device-description"><p class="eyebrow" data-i18n="yourReader"></p><h2 id="device-title" data-i18n="connectHeading"></h2><p id="device-connection" class="muted" data-i18n="connectLede"></p><small id="scan-time" class="muted"></small></div>
      <div class="device-metric"><strong id="book-count">—</strong><span data-i18n="booksNav"></span></div><div class="device-metric"><strong>—</strong><span data-i18n="annotationsNav"></span><small data-i18n="notImported"></small></div>
    </section>
    <div class="content-grid">
      <section class="panel books-panel" id="books"><div class="panel-heading"><h2 data-i18n="booksHeading"></h2><span class="pill" data-i18n="readOnly"></span></div>
        <input id="book-search" type="search" data-i18n-aria-label="search" placeholder="Buscar título o autor…"/>
        <div class="filters" role="group" data-i18n-aria-label="filters"><button data-filter="all" aria-pressed="true" data-i18n="allBooks"></button><button data-filter="known" aria-pressed="false" data-i18n="withProgress"></button><button data-filter="unknown" aria-pressed="false" data-i18n="unavailable"></button></div>
        <div id="books-empty" class="empty"><span class="empty-icon" aria-hidden="true">▤</span><h3 data-i18n="emptyTitle"></h3><p data-i18n="emptyBody"></p></div>
        <section id="review-result" hidden><p id="review-summary" class="muted"></p><ul id="book-preview"></ul><p id="no-matches" class="empty" hidden data-i18n="noMatches"></p><button id="review-issues" hidden></button><div id="review-editor" hidden></div><p id="review-detail" class="fine-print"></p></section>
        <div class="notice"><span aria-hidden="true">ⓘ</span><p data-i18n="missingNotice"></p></div>
      </section>
      <div class="right-column"><section class="panel" id="annotations"><div class="panel-heading"><h2 data-i18n="annotationsHeading"></h2><span class="pill neutral" data-i18n="soon"></span></div><div class="annotation-placeholder" aria-hidden="true">“</div><h3 data-i18n="annotationsEmpty"></h3><p class="muted" data-i18n="annotationsBody"></p><p class="fine-print" data-i18n="annotationsPrivacy"></p></section>
      <section class="panel pecia-panel"><span class="eyebrow">PECIA</span><h2 data-i18n="readyHeading"></h2><p data-i18n="readyBody"></p><a id="pecia-link" href="https://pecia.app/?utm_source=pecia-sync&utm_medium=desktop-app&utm_campaign=sync-beta" data-i18n="openPecia"></a></section></div>
    </div><footer data-i18n="footer"></footer>
  </main>
</div><script type="module" src="/src/main.ts"></script>
</body></html>
