name: Source archive audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Rebuild source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run licenses:generate
      - run: node scripts/source-bundle.mjs
      - name: Prepare QCMS verification toolchain
        if: runner.os == 'Linux'
        run: docker build --platform linux/amd64 -f scripts/qcms-rebuild.Dockerfile -t pecia-qcms-rebuild:verification .
      - name: Prepare OpenJPEG verification toolchain
        if: runner.os == 'Linux'
        run: docker pull --platform linux/amd64 emscripten/emsdk@sha256:e077d54e2b8970575ebc4f185ac1de0b95c05f2b266134d4ba27449af7aebf65
      - run: node scripts/verify-source.mjs
        # Images are prepared online; decoder builds themselves disable networking.
        env:
          PECIA_VERIFY_QCMS: ${{ runner.os == 'Linux' && '1' || '0' }}
          PECIA_VERIFY_OPENJPEG: ${{ runner.os == 'Linux' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: source-verification-${{ runner.os }}
          path: |
            build/source/source-verification.json
            build/source/openjpeg-verification.json
          if-no-files-found: error
