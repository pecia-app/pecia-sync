name: Native verification (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Select controlled Windows plugin toolchain
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target i686-pc-windows-msvc
          rustup default 1.97.0
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm test
      - run: npm run licenses:test
      - run: npm run build
      - run: npm run licenses:generate
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build
      - name: Verify controlled plugin in installer
        if: runner.os == 'Windows'
        run: node scripts/windows-plugin-verify.mjs
      - run: npm run licenses:check
