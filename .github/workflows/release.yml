name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm test
      - run: npm run tauri build
      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: pecia-sync-${{ runner.os }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          find release -type f \( \
            -name '*.dmg' -o \
            -name '*.msi' -o \
            -name '*-setup.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' \
          \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Attach installers and checksums
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            release/**/*.dmg
            release/**/*.msi
            release/**/*-setup.exe
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            SHA256SUMS.txt
