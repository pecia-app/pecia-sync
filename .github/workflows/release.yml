name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compliance:
    name: Verify licensing and prepare matching source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run licenses:release-check
      - run: npm ci
      - run: npm run licenses:generate
      - run: npm run licenses:check
      - run: node scripts/source-bundle.mjs
      - name: Install source verification dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: node scripts/verify-source.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pecia-sync-source
          path: build/source/
          if-no-files-found: error

  package:
    needs: compliance
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm test
      - name: Select controlled Windows plugin toolchain
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target i686-pc-windows-msvc
          rustup default 1.97.0
      - run: npm run tauri build
      - name: Verify controlled plugin in installer
        if: runner.os == 'Windows'
        run: node scripts/windows-plugin-verify.mjs
      - name: Collect matching Linux native source
        if: runner.os == 'Linux'
        env:
          PECIA_REPLAY_TOOLS: build/installer-audit/linuxdeploy-tools/squashfs-root/usr/bin
        run: |
          node --test scripts/linux-native-bundle.test.mjs
          node scripts/linux-replay-tools.mjs
          node scripts/linux-native-evidence.mjs
          sudo sed -i -E 's/^Types:[[:space:]]+deb[[:space:]]*$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          node scripts/linux-native-source.mjs
          node scripts/linux-native-bundle.mjs
      - name: Retain native source supplement
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pecia-sync-native-source
          path: build/native-source/
          if-no-files-found: error
      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: pecia-sync-${{ runner.os }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [compliance, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run licenses:release-check
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          find release -type f \( \
            -name 'pecia-sync-source-*.tar.gz' -o \
            -name 'pecia-sync-native-source-*.tar.gz' -o \
            -name '*.dmg' -o \
            -name '*.msi' -o \
            -name '*-setup.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' \
          \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Attach installers and checksums
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          body: |
            The combined Pecia Sync desktop application is GPL-3.0-or-later.
            Existing component notices and licenses remain intact.
            Matching source is supplied in the attached pecia-sync-source archive.
            The pecia-sync-native-source supplement contains matching Ubuntu
            source packages for the verified libraries bundled in the AppImage.
            See docs/LICENSING.md in that archive for build instructions and notices.
            No warranty is provided; see the bundled GPL license for full terms.
          files: |
            release/pecia-sync-source-*.tar.gz
            release/SOURCE-SHA256SUMS.txt
            release/pecia-sync-native-source-*.tar.gz
            release/NATIVE-SOURCE-SHA256SUMS.txt
            release/**/*.dmg
            release/**/*.msi
            release/**/*-setup.exe
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            SHA256SUMS.txt
