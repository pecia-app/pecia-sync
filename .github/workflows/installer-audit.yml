name: Installer audit (non-publishing)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to audit (use all for final candidates)
        type: choice
        default: all
        options: [all, macos-latest, ubuntu-latest, windows-latest]

permissions:
  contents: read

jobs:
  package:
    name: Retain audit installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["macos-latest","ubuntu-latest","windows-latest"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Select controlled Windows plugin toolchain
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target i686-pc-windows-msvc
          rustup default 1.97.0
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool imagemagick dbus-x11 libfuse2t64
      - run: npm ci
      - run: npm test
      - run: npm run licenses:test
      - run: node --test scripts/runtime-source.test.mjs
      - run: node --test scripts/windows-plugin-template.test.mjs
      - run: node --test scripts/macos-build-evidence.test.mjs
      - run: node --test scripts/linux-notices.test.mjs scripts/linux-native-evidence.test.mjs scripts/linux-native-replay.test.mjs scripts/linux-native-source.test.mjs
      - run: node --test scripts/linux-native-bundle.test.mjs
      - name: Capture macOS toolchain before build
        if: runner.os == 'macOS'
        run: node scripts/macos-build-evidence.mjs before
      - run: npm run licenses:generate
      - name: Retain matching source candidate
        run: node scripts/source-bundle.mjs
      - name: Verify source and package from the extracted archive
        env:
          PECIA_PACKAGE_SOURCE: '1'
        run: node scripts/verify-source.mjs
      - name: Confirm macOS toolchain after build
        if: runner.os == 'macOS'
        run: node scripts/macos-build-evidence.mjs after
      - run: npm run licenses:check
      - name: Record hashes and retain bundle structure
        env:
          PECIA_REQUIRE_SOURCE_BUILD: '1'
        run: node scripts/installer-audit.mjs
      - name: Launch candidate AppImage through FUSE and extraction
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- node scripts/linux-desktop-smoke.mjs
      - name: Map AppDir native files to Linux source-package versions
        if: runner.os == 'Linux'
        env:
          PECIA_REPLAY_TOOLS: build/installer-audit/linuxdeploy-tools/squashfs-root/usr/bin
        run: |
          node scripts/linux-replay-tools.mjs
          node scripts/linux-native-evidence.mjs
      - name: Enable Ubuntu source indexes
        if: runner.os == 'Linux'
        run: |
          sudo sed -i -E 's/^Types:[[:space:]]+deb[[:space:]]*$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
      - name: Collect exact native source-package archives
        if: runner.os == 'Linux'
        run: node scripts/linux-native-source.mjs
      - name: Package and retain native source supplement
        if: runner.os == 'Linux'
        run: node scripts/linux-native-bundle.mjs
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: native-source-${{ github.sha }}
          path: build/native-source/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-source-${{ runner.os }}-${{ github.sha }}
          path: build/source/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-audit-${{ runner.os }}-${{ github.sha }}
          path: build/installer-audit/
          if-no-files-found: error
          retention-days: 14
