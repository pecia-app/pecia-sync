name: Installer audit (non-publishing)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/installer-audit.yml'
      - '.github/workflows/release.yml'
      - 'scripts/installer-audit.mjs'
      - 'scripts/macos-build-evidence*.mjs'
      - 'scripts/linux-*.mjs'
      - 'scripts/licenses.mjs'
      - 'src-tauri/tauri.conf.json'

permissions:
  contents: read

jobs:
  package:
    name: Retain audit installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm test
      - run: npm run licenses:test
      - run: node --test scripts/macos-build-evidence.test.mjs
      - run: node --test scripts/linux-notices.test.mjs scripts/linux-native-evidence.test.mjs scripts/linux-native-replay.test.mjs scripts/linux-native-source.test.mjs
      - run: node --test scripts/linux-native-bundle.test.mjs
      - name: Capture macOS toolchain before build
        if: runner.os == 'macOS'
        run: node scripts/macos-build-evidence.mjs before
      - run: npm run tauri build
      - name: Confirm macOS toolchain after build
        if: runner.os == 'macOS'
        run: node scripts/macos-build-evidence.mjs after
      - run: npm run licenses:check
      - name: Record hashes and retain bundle structure
        run: node scripts/installer-audit.mjs
      - name: Map AppDir native files to Linux source-package versions
        if: runner.os == 'Linux'
        env:
          PECIA_REPLAY_TOOLS: build/installer-audit/linuxdeploy-tools/squashfs-root/usr/bin
        run: |
          node scripts/linux-replay-tools.mjs
          node scripts/linux-native-evidence.mjs
      - name: Enable Ubuntu source indexes
        if: runner.os == 'Linux'
        run: |
          sudo sed -i -E 's/^Types:[[:space:]]+deb[[:space:]]*$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
      - name: Collect exact native source-package archives
        if: runner.os == 'Linux'
        run: node scripts/linux-native-source.mjs
      - name: Package and retain native source supplement
        if: runner.os == 'Linux'
        run: node scripts/linux-native-bundle.mjs
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: native-source-${{ github.sha }}
          path: build/native-source/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-audit-${{ runner.os }}-${{ github.sha }}
          path: build/installer-audit/
          if-no-files-found: error
          retention-days: 14
